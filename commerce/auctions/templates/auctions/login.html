{% extends "auctions/layout.html" %}

{% block body %}

<div class="mx-auto col-md-3 text-light">
    <h2 class="text-light">Login</h2>

    {% if message %}
        <div class="text-danger">{{ message }}</div>
    {% endif %}

        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <input autofocus class="form-control  mt-3" type="text" name="username" placeholder="Username">
            </div>
            <div class="form-group">
                <input class="form-control mt-3" type="password" name="password" placeholder="Password">
            </div>
            <input class="btn btn-primary mt-3" type="submit" value="Login">
        </form>
        
        Don't have an account? <a href="{% url 'register' %}">Register here.</a>
</div>

{% endblock %}
