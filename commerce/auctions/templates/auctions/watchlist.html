{% extends "auctions/layout.html" %}

{% block body %}
<!-- Adding a container gives the grid proper alignment and margins -->
    <div class="container mt-4">
        <h2 class="text-light">Active Watchlists:</h2>
        <hr>
        
        <!-- THIS ROW DIV IS REQUIRED FOR SIDE-BY-SIDE CARDS -->
        <div class="row">
            
            {% for listing in listings %}
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                    <div class="card h-100">
                        {% if listing.image_url %}
                            <img class="card-img-top" src="{{ listing.image_url }}" alt="{{ listing.title }}" style="height: 200px; object-fit: cover;">
                        {% else %}
                            <img class="card-img-top" src="https://via.placeholder.com/150" alt="No image provided" style="height: 200px; object-fit: cover;">
                        {% endif %}
                        
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">{{ listing.title }}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">Rs.{{ listing.highestBid }}</h6>
                            <p class="card-text">{{ listing.description|truncatechars:100 }}</p>
                            
                            <a href="{% url 'listing_details' listing.id %}" class="btn btn-primary mt-auto">View Details</a>
                        </div>
                    </div>
                </div>
            {% endfor %}
            
        </div> <!-- Close the row div here -->
        
    </div> <!-- Close the container div here -->
{% endblock %}
