{% extends "auctions/layout.html" %}

{% block body %}
    <div class="mx-auto col-md-3">
        
        <h2 class="text-light">Register</h2>

        {% if message %}
            <div class="text-danger" >{{ message }}</div>
        {% endif %}

        <form action="{% url 'register' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <input class="form-control mt-3" autofocus type="text" name="username" placeholder="Username">
            </div>
            <div class="form-group">
                <input class="form-control mt-3" type="email" name="email" placeholder="Email Address">
            </div>
            <div class="form-group">
                <input class="form-control mt-3" type="password" name="password" placeholder="Password">
            </div>
            <div class="form-group">
                <input class="form-control mt-3" type="password" name="confirmation" placeholder="Confirm Password">
            </div>
            <input class="btn btn-primary mt-3" type="submit" value="Register">
        </form>

        <p class="mt-1 text-light">Already have an account? <a href="{% url 'login' %}">Log In here.</a></p>

    </div>
{% endblock %}
